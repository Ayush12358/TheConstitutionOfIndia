name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run verify_repo.py (5 checks)
        run: python verify_repo.py

  website-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps and build website
        run: cd website && bun install --frozen-lockfile && bun run build
      - name: Run unit tests
        run: cd website && bun test
      - name: Smoke test content API
        run: |
          cd website
          bun start & server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 3
          curl -fsS http://localhost:3000/api/content/preamble | grep -q 'WE, THE PEOPLE OF INDIA'
          curl -fsS 'http://localhost:3000/api/search?q=secular' | grep -q 'preamble'
          curl -fsS http://localhost:3000/ -o /dev/null
          curl -fsS http://localhost:3000/api/amendments | grep -q '"number":"106"'
          curl -fsS -o /dev/null -w '%{http_code}' http://localhost:3000/api/file/act/106 | grep -q 200
